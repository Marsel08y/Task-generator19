<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор Задач</title>
    <link rel="stylesheet" href="/public/style.css">
</head>
<body>
    <div class="bg-glow"></div>

    <div id="auth-overlay" class="modal-overlay">
        <div class="glass-card">
            <h1 class="logo">ГЕНЕРАТОР<span>ЗАДАЧ</span></h1>
            <input type="text" id="username-input" placeholder="Ваш ник..." maxlength="12">
            <button id="start-game-btn" class="glow-btn">НАЧАТЬ</button>
        </div>
    </div>

    <main id="game-ui" style="display:none;">
        <div class="glass-card">
            <div class="header">
                <div>👤 <span id="display-username"></span></div>
                <div class="timer-circle">
                    <svg><circle cx="35" cy="35" r="32"></circle></svg>
                    <span id="timer-text">30</span>
                </div>
                <div>Счет: <span id="score">0</span></div>
            </div>
            
            <div class="task-box">
                <h2 id="question">--</h2>
                <input type="text" id="answer-input" placeholder="Ответ..." autocomplete="off">
                <div id="feedback"></div>
            </div>

            <div class="bottom-controls">
                <button id="show-tops-btn" class="secondary-btn">🏆 РЕЙТИНГ</button>
                <button id="show-help-btn" class="secondary-btn">❓ ПОМОЩЬ</button>
            </div>
        </div>
    </main>

    <div id="tops-modal" class="modal-overlay" style="display:none;">
        <div class="glass-card">
            <h2>РЕЙТИНГ</h2>
            <div id="full-leaderboard"></div>
            <button class="glow-btn" onclick="document.getElementById('tops-modal').style.display='none'">ЗАКРЫТЬ</button>
        </div>
    </div>

    <div id="help-modal" class="modal-overlay" style="display:none;">
        <div class="glass-card">
            <h2>ПОМОЩЬ</h2>
            <p>У тебя есть 30 секунд на пример.</p>
            <p>За ошибку: -5 очков.</p>
            <button class="glow-btn" onclick="document.getElementById('help-modal').style.display='none'">ОК</button>
        </div>
    </div>

    <script src="/public/script.js"></script>
</body>
</html>
